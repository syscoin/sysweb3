on:
  pull_request:
    types: [opened, synchronize]
jobs:
  secrets:
    name: Create env file with gh secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22 --ignore-scripts
      - run: yarn install --frozen-lockfile
      - name: Install keyring source-test dependencies
        run: |
          for package in sysweb3-core sysweb3-network sysweb3-utils sysweb3-keyring; do
            yarn --cwd "packages/$package" install --frozen-lockfile --ignore-scripts
          done
      - run: |
          touch .env
          echo SEED_LAW_COOK=${{ secrets.SEED_LAW_COOK }} >> .env
          echo SEED_PEACE_GLOBE=${{ secrets.SEED_PEACE_GLOBE }} >> .env
          echo SEED_SWALLOW_HEALTH=${{ secrets.SEED_SWALLOW_HEALTH }} >> .env
      - name: Validate transaction signing and RPC regressions
        working-directory: packages/sysweb3-keyring
        timeout-minutes: 10
        # Existing unit fixtures leave timers/listeners after completion.
        # --forceExit retains Jest's failure exit status; it does not skip tests.
        run: |
          NODE_ENV=test node ../../node_modules/jest/bin/jest.js --config jest.config.js --runInBand --silent --forceExit \
            test/unit/transactions/ethereum-fee-data.spec.ts \
            test/unit/providers-rpc-integrity.spec.ts \
            test/unit/transactions/ethereum-transactions.spec.ts \
            test/unit/transactions/ethereum-hardware-context.spec.ts \
            test/unit/transactions/ethereum-send-context.spec.ts \
            test/unit/transactions/prepared-evm.spec.ts \
            test/unit/transactions/ethereum-submission-boundary.spec.ts \
            test/unit/transactions/ethereum-cancellation-identity.spec.ts \
            test/unit/transactions/ethereum-cancellation-fee-consent.spec.ts \
            test/unit/transactions/evm-local-signer.spec.ts \
            test/unit/transactions/ethereum-replacement.spec.ts \
            test/unit/transactions/syscoin-transactions.spec.ts \
            test/unit/transactions/software-boundary.spec.ts \
            test/unit/transactions/native-sweep.spec.ts
      - name: Validate network RPC regressions
        working-directory: packages/sysweb3-network
        run: |
          NODE_ENV=test node ../../node_modules/jest/bin/jest.js --config jest.config.js --runInBand --silent
      - name: Build keyring and validate vault custody
        run: |
          node node_modules/typescript/bin/tsc -p packages/sysweb3-keyring/tsconfig.json
          node node_modules/typescript/bin/tsc -p packages/sysweb3-keyring/tsconfig-ledger-host.json
          cd packages/sysweb3-keyring
          # The initialization fixtures retain their existing hardware timers.
          # forceExit preserves the test result; it does not skip assertions.
          NODE_ENV=test node ../../node_modules/jest/bin/jest.js --config jest.config.js --runInBand --silent --forceExit \
            test/unit/storage-core.spec.ts \
            test/unit/keyring-manager/software-entry.spec.ts \
            test/unit/keyring-manager/software-indexed-hd.spec.ts \
            test/unit/keyring-manager/initialization.spec.ts \
            test/unit/keyring-manager/unlock-errors.spec.ts \
            test/unit/keyring-manager/vault-kdf-compatibility.spec.ts \
            test/unit/keyring-manager/storage-adapter.spec.ts \
            test/unit/keyring-manager/private-records.spec.ts
          node test/software-entry-runtime.cjs
      - name: Validate hardware transport and signing regressions
        working-directory: packages/sysweb3-keyring
        timeout-minutes: 10
        # The preceding build produces the plain-Node Connect protocol fixture.
        run: |
          NODE_ENV=test node ../../node_modules/jest/bin/jest.js --config jest.config.js --runInBand --silent \
            test/unit/hardware/trezor-connect-adapter.spec.ts \
            test/unit/hardware/trezor-manager-lifecycle.spec.ts \
            test/unit/hardware/trezor-suite-connect.spec.ts \
            test/unit/hardware/trezor-address.spec.ts \
            test/unit/hardware/trezor-witness.spec.ts \
            test/unit/hardware/trezor-transaction-invariants.spec.ts \
            test/unit/hardware/trezor.spec.ts \
            test/unit/hardware/ledger-dmk-session.spec.ts \
            test/unit/hardware/ledger-dmk-utxo.spec.ts \
            test/unit/hardware/ledger-dmk-evm.spec.ts \
            test/unit/hardware/ledger-authority-boundary.spec.ts \
            test/unit/hardware/ledger-output-map.spec.ts \
            test/unit/hardware/ledger.spec.ts \
            test/unit/hardware/ledger-finalized-inputs.spec.ts \
            test/unit/hardware/current-ledger-devices.spec.ts \
            test/unit/ledger/bitcoin_client/policy.spec.ts \
            test/unit/ledger/bitcoin_client/psbtv2.p2wpkh.spec.ts
      - name: Validate watch-only descriptor regressions
        working-directory: packages/sysweb3-keyring
        run: |
          NODE_ENV=test node ../../node_modules/jest/bin/jest.js --config jest.config.js --runInBand --silent \
            test/unit/keyring-manager/import-watchonly.spec.ts \
            test/unit/keyring-manager/watch-descriptor-lifecycle.spec.ts \
            test/unit/utils/watch-descriptor.spec.ts
      - name: Validate offline public BIP84 account entry
        working-directory: packages/sysweb3-keyring
        run: |
          NODE_ENV=test node ../../node_modules/jest/bin/jest.js --config jest.config.js --runInBand --silent test/unit/utils/public-bip84.spec.ts test/unit/transactions/bip84-native-plan.spec.ts test/unit/keyring-manager/software-utxo-account.spec.ts
          node ../../scripts/package/copy
          node test/public-bip84-package.cjs
